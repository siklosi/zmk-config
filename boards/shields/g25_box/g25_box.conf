# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ------------ Battery optimizations ------------

# Deep sleep after inactivity (most important power saving)
CONFIG_ZMK_SLEEP=y

# Idle timeout before "soft" idle state (e.g. reduces BLE polling) - 60 seconds
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Deep sleep timeout after idle - 30 minutes
# Wheel box is often left idle between races/sessions, so 30 min is a good balance
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Report battery level to the PC/host (shows % in BLE device properties)
CONFIG_ZMK_BATTERY_REPORTING=y

